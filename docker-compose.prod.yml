# LensLog — Production
#
# Differences from dev:
#   - Frontend is built into a static dist/ and served by Nginx (no live reload)
#   - No port exposure for db/redis (only Nginx is public-facing)
#   - All secrets come from environment variables, not hardcoded defaults

services:
  db:
    image: postgis/postgis:14-3.3
    restart: always
    environment:
      POSTGRES_DB: lenslog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.exif_tasks.celery_app worker --loglevel=info -c 4

  frontend_build:
    # One-shot service: builds the React app and exits.
    # Output lands in the frontend_dist named volume for Nginx to serve.
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend_dist:/app/frontend/dist
    command: >
      sh -c "
        cd /app/shared && npm ci --silent &&
        cd /app/frontend && npm ci --silent &&
        npm run build &&
        cp -r dist/* /dist/
      "
    profiles:
      - build

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
