# LensLog — Production
#
# Differences from dev:
#   - Frontend is built into a static dist/ and served by Nginx (no live reload)
#   - No port exposure for db/redis/minio (only Nginx is public-facing)
#   - All secrets come from environment variables, not hardcoded defaults

services:
  db:
    image: postgis/postgis:14-3.3
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: lenslog
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    env_file:
      - ./backend/.env
    command: >
      -c "
        set -eu
        mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY}
        mc mb --ignore-existing local/$${STORAGE_BUCKET_NAME}
        mc anonymous set download local/$${STORAGE_BUCKET_NAME}
        printf '{\"CORSRules\":[{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"DELETE\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}' > /tmp/cors.json
        mc cors set local/$${STORAGE_BUCKET_NAME} /tmp/cors.json || echo 'warning: CORS policy failed, continuing'
        printf '{\"Rules\":[{\"ID\":\"delete-pending-photo-uploads\",\"Status\":\"Enabled\",\"Filter\":{\"And\":{\"Prefix\":\"photos/\",\"Tags\":[{\"Key\":\"upload_state\",\"Value\":\"pending\"}]}},\"Expiration\":{\"Days\":1}}]}' > /tmp/lifecycle.json
        mc ilm import local/$${STORAGE_BUCKET_NAME} < /tmp/lifecycle.json
      "

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_townships.py &&
        gunicorn app.main:app
          --worker-class uvicorn.workers.UvicornWorker
          --workers 4
          --bind 0.0.0.0:8000
          --timeout 120
      "

  celery_worker:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.exif_tasks.celery_app worker --loglevel=info -c 4

  frontend_build:
    # One-shot service: builds the React app and exits.
    # Output lands in the frontend_dist named volume for Nginx to serve.
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend_dist:/app/frontend/dist
    command: >
      sh -c "
        cd /app/shared && npm ci --silent &&
        cd /app/frontend && npm ci --silent &&
        npm run build
      "
    profiles:
      - build

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_dist:
