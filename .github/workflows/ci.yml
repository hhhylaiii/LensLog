name: CI

on:
  push:
    branches: [main, develop, "feature/**", "feat/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------
  # 1. Backend — Python / FastAPI
  # --------------------------------------------------------
  backend-test:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:14-3.3
        env:
          POSTGRES_DB: lenslog_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Type check with mypy
        run: |
          cd backend
          mypy app --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/lenslog_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          pytest tests/ -v --tb=short

  # --------------------------------------------------------
  # 2. Shared package — types, API, stores, schemas, hooks
  #    Uses `npm install` (not `npm ci`) because @tanstack/react-query
  #    is a devDependency added after the last lock-file commit.
  # --------------------------------------------------------
  shared-typecheck:
    name: Shared Package (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd shared
          npm install

      - name: Type check
        run: |
          cd shared
          npm run typecheck

  # --------------------------------------------------------
  # 3. Web frontend — React + Vite
  # --------------------------------------------------------
  frontend-lint:
    name: Frontend Web (TypeScript)
    runs-on: ubuntu-latest
    needs: shared-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared dependencies
        run: |
          cd shared
          npm install

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npm run typecheck

  # --------------------------------------------------------
  # 4. Mobile app — Expo + React Native
  #    Uses `npm install` (not `npm ci`) — no lock file committed.
  # --------------------------------------------------------
  mobile-lint:
    name: Mobile App (TypeScript)
    runs-on: ubuntu-latest
    needs: shared-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shared dependencies
        run: |
          cd shared
          npm install

      - name: Install mobile dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Lint
        run: |
          cd mobile
          npm run lint

      - name: Type check
        run: |
          cd mobile
          npm run typecheck
