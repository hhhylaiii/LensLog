# LensLog — Local Development
#
# Starts: PostgreSQL + PostGIS, Redis, FastAPI backend, Celery worker, React web frontend.
#
# The mobile app (Expo) is NOT included here — it runs locally via:
#   cd mobile && npx expo start
#
# Quick start:
#   docker-compose up -d
#   docker-compose exec backend alembic upgrade head
#   open http://localhost:5173   # web
#   open http://localhost:8000/docs  # API docs

services:
  db:
    image: postgis/postgis:14-3.3
    container_name: lenslog_db
    environment:
      POSTGRES_DB: lenslog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lenslog_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: lenslog_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_init:
    image: minio/mc
    container_name: lenslog_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/lenslog-dev &&
        mc anonymous set download local/lenslog-dev
      "

  backend:
    build: ./backend
    container_name: lenslog_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/lenslog
      REDIS_URL: redis://redis:6379/0
      DEBUG: "True"
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    container_name: lenslog_celery
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/lenslog
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.exif_tasks.celery_app worker --loglevel=info

  frontend:
    image: node:20-alpine
    container_name: lenslog_frontend
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://lenslog_backend:8000
    volumes:
      # Mount the entire repo root so the @shared alias resolves.
      # frontend/ and shared/ are siblings on the same volume.
      - .:/app
      # Isolate node_modules inside the container to avoid host/container conflicts
      - frontend_node_modules:/app/frontend/node_modules
      - shared_node_modules:/app/shared/node_modules
    command: >
      sh -c "
        cd /app/shared && npm install --silent &&
        cd /app/frontend && npm install --silent &&
        npm run dev -- --host
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  shared_node_modules:
