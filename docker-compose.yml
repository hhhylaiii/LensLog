# LensLog — Local Development
#
# Starts: PostgreSQL + PostGIS, Redis, MinIO, FastAPI backend, Celery worker, React web frontend.
#
# The mobile app (Expo) is NOT included here — it runs locally via:
#   cd mobile && npx expo start
#
# Quick start (no .env file needed):
#   docker-compose up
#   open http://localhost:5173   # web
#   open http://localhost:8000/docs  # API docs
#
# DB migrations run automatically on backend startup.

services:
  db:
    image: postgis/postgis:14-3.3
    container_name: lenslog_db
    environment:
      POSTGRES_DB: lenslog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lenslog_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: lenslog_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_init:
    image: minio/mc
    container_name: lenslog_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
        set -eu
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/lenslog-dev
        mc anonymous set download local/lenslog-dev
        printf '{\"CORSRules\":[{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"DELETE\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}' > /tmp/cors.json
        if ! mc cors set local/lenslog-dev /tmp/cors.json; then
          echo 'warning: failed to apply MinIO CORS policy; continuing so lifecycle can still be installed'
        fi
        printf '{\"Rules\":[{\"ID\":\"delete-pending-photo-uploads\",\"Status\":\"Enabled\",\"Filter\":{\"And\":{\"Prefix\":\"photos/\",\"Tags\":[{\"Key\":\"upload_state\",\"Value\":\"pending\"}]}},\"Expiration\":{\"Days\":1}}]}' > /tmp/lifecycle.json
        mc ilm import local/lenslog-dev < /tmp/lifecycle.json
      "

  backend:
    build: ./backend
    container_name: lenslog_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/lenslog
      REDIS_URL: redis://redis:6379/0
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET_NAME: lenslog-dev
      STORAGE_REGION: us-east-1
      FRONTEND_URL: http://localhost:5173
      OPENMETEO_BASE_URL: https://api.open-meteo.com/v1
      SUNRISE_SUNSET_API_URL: https://api.sunrise-sunset.org/json
      CWA_BASE_URL: https://opendata.cwa.gov.tw/api/v1/rest/datastore
      CWA_API_KEY: ${CWA_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_townships.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  celery_worker:
    build: ./backend
    container_name: lenslog_celery
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/lenslog
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      #Celery Worker的環境變數修改
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET_NAME: lenslog-dev
      STORAGE_REGION: us-east-1
      #
      OPENMETEO_BASE_URL: https://api.open-meteo.com/v1
      SUNRISE_SUNSET_API_URL: https://api.sunrise-sunset.org/json
      CWA_BASE_URL: https://opendata.cwa.gov.tw/api/v1/rest/datastore
      CWA_API_KEY: ${CWA_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.exif_tasks.celery_app worker --loglevel=info

  frontend:
    image: node:20-alpine
    container_name: lenslog_frontend
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    environment:
      # Uses Docker service name (not container_name) for reliability
      VITE_API_TARGET: http://backend:8000
    volumes:
      # Mount the entire repo root so the @shared alias resolves.
      # frontend/ and shared/ are siblings on the same volume.
      - .:/app
      # Isolate node_modules inside the container to avoid host/container conflicts
      - frontend_node_modules:/app/frontend/node_modules
      - shared_node_modules:/app/shared/node_modules
    command: >
      sh -c "
        cd /app/shared && npm install --silent &&
        cd /app/frontend && npm install --silent &&
        npm run dev -- --host
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  shared_node_modules:
